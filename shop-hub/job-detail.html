<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Shop Hub - Job Detail</title>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .job-badge {
      display: inline-block;
      font-size: 0.8em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 2px;
      margin-left: 0.6em;
      vertical-align: middle;
    }
    .job-badge.overdue  { background: var(--danger-button);  color: var(--text-color-2); }
    .job-badge.due-soon { background: #7a5800;               color: #ffd; }
    .job-badge.open     { background: var(--bg-color-3);     color: var(--text-color);   }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title-block">Shop Hub</h1>
    <div class="wrapper">
      <div class="menu-block">
        <h3>Job Detail</h3>
        <ul>
          <li><a href="jobs.html">Back to Jobs</a></li>
        </ul>
      </div>
      <div class="app-content">
        <div id="jobDetailContent">
          <p>Loading job...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="job-detail.js"></script>
</body>
</html>
