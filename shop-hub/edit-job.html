<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Shop Hub - Add/Edit Job</title>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title-block">Shop Hub</h1>
    <div class="wrapper">
      <div class="menu-block">
        <h3>Add/Edit Job</h3>
        <ul>
          <li><a href="jobs.html">View Jobs List</a></li>
        </ul>
      </div>
      <div class="app-content">
        <div class="alert">Saved job!</div>
        <form id="inputForm">
          <p class="full">
            <label>Job ID</label>
            <input type="text" name="jobId" id="jobId" required placeholder="e.g. JOB-001">
          </p>
          <p class="full">
            <label>Part</label>
            <select name="partId" id="partId" required>
              <option value="">— select a part —</option>
              <!-- Options injected by JS -->
            </select>
          </p>
          <p>
            <label>Quantity Ordered</label>
            <input type="number" min="1" name="quantityOrdered" id="quantityOrdered" required>
          </p>
          <p>
            <!-- spacer to keep grid balanced -->
          </p>
          <p>
            <label>Start Date</label>
            <input type="date" name="startDate" id="startDate">
          </p>
          <p>
            <label>Due Date</label>
            <input type="date" name="dueDate" id="dueDate">
          </p>
          <p class="full">
            <label>Notes</label>
            <textarea name="notes" id="notes" rows="4"></textarea>
          </p>
          <p class="full">
            <button class="submit-btn" type="submit">Submit</button>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="edit-job.js"></script>
</body>
</html>
